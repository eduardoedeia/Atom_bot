<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATOM BOT v2.1</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{height:48px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.logo{font-weight:900}.logo span{color:#00ff88}.pause{background:#ff1a1a;color:#fff;border:0;padding:6px 14px;border-radius:4px;font-weight:800}.times{display:flex;gap:5px}.times button{background:#1e1e1e;border:1px solid #333;color:#888;padding:4px 7px;border-radius:4px;font-size:11px}.times button.active{background:#fff;color:#000}.ativo{font-size:11px;background:#1a1a1a;padding:4px 8px;border-radius:4px;border:1px solid #333}.chart{flex:1;position:relative;background:#0e0e10}canvas{width:100%;height:100%}.atom{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:220px}.core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background:#ffdd00;border-radius:50%;box-shadow:0 0 20px #ffdd00}.orbit{position:absolute;top:50%;left:50%;border:1px solid rgba(0,255,150,.6);border-radius:50%}.o1{width:100px;height:100px;margin:-50px 0 0 -50px;animation:r1 2s linear infinite}.o2{width:160px;height:160px;margin:-80px 0 0 -80px;animation:r2 3s linear infinite}.o3{width:220px;height:220px;margin:-110px 0 0 -110px;animation:r3 2.5s linear infinite}.dot{position:absolute;width:10px;height:10px;background:#00ff88;border-radius:50%;top:-5px;left:50%}@keyframes r1{0%{transform:translate(-50%,-50%) rotateX(70deg) rotateZ(0)}100%{transform:translate(-50%,-50%) rotateX(70deg) rotateZ(360deg)}}@keyframes r2{0%{transform:translate(-50%,-50%) rotateX(20deg) rotateY(60deg) rotateZ(0)}100%{transform:translate(-50%,-50%) rotateX(20deg) rotateY(60deg) rotateZ(360deg)}}@keyframes r3{0%{transform:translate(-50%,-50%) rotateX(-40deg) rotateY(-20deg) rotateZ(0)}100%{transform:translate(-50%,-50%) rotateX(-40deg) rotateY(-20deg) rotateZ(360deg)}}.line{position:absolute;left:0;right:0;height:1px;background:#ffdd00;top:46%}.line span{position:absolute;right:0;top:-10px;background:#ffdd00;color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px}.bar{background:#00c950;color:#000;font-weight:900;text-align:center;padding:12px;font-size:13px}.console{height:120px;background:#000;border-top:1px solid #222;padding:8px 10px;font-family:monospace;font-size:11px;overflow:auto}.green{color:#00ff88}.yellow{color:#ffdd00}</style></head><body><div class="top"><div class="logo">ATOM BOT <span>v2.1</span></div><button class="pause">PAUSE</button><div class="times"><button>5s</button><button>10s</button><button class="active">30s</button><button>M1</button><button>M5</button><button>M15</button></div><div class="ativo">ATIVO: EUR/JPY (OTC)</div></div><div class="chart"><canvas id="c"></canvas><div class="line"><span>162.891</span></div><div class="atom"><div class="orbit o1"><div class="dot"></div></div><div class="orbit o2"><div class="dot"></div></div><div class="orbit o3"><div class="dot"></div></div><div class="core"></div></div></div><div class="bar" id="bar">ANALISANDO MERCADO - EUR/JPY (OTC) - AGUARDE...</div><div class="console" id="con"><div class="green">> ATOM v2.1 ATIVO</div><div>> EUR/JPY (OTC) 30s</div><div class="yellow">> Soros 2x | Gale 1</div><div>SINAIS: <b id="t">1</b></div></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');function rs(){cv.width=cv.offsetWidth*2;cv.height=cv.offsetHeight*2}rs();let cds=[],pr=162.891;for(let i=0;i<60;i++)cds.push({o:pr+(Math.random()-.5)*.08,c:pr+(Math.random()-.5)*.08});function dr(){let W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0e0e10';ctx.fillRect(0,0,W,H);let cw=Math.max(12,W/70);cds.forEach((cd,i)=>{let x=i*(cw+8)+40,oy=H*.5-(cd.o-pr)*1600,cy=H*.5-(cd.c-pr)*1600,hy=Math.min(oy,cy)-36,ly=Math.max(oy,cy)+36,gr=cd.c>cd.o;ctx.fillStyle=gr?'#00ff88':'#ff3344';ctx.strokeStyle=gr?'#00ff88':'#ff3344';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+cw/2,hy);ctx.lineTo(x+cw/2,ly);ctx.stroke();ctx.fillRect(x,Math.min(oy,cy),cw,Math.max(6,Math.abs(cy-oy)))});pr+=(Math.random()-.5)*.004;cds[cds.length-1].c=pr;if(Math.random()>.92){cds.shift();cds.push({o:pr,c:pr+(Math.random()-.5)*.05})}requestAnimationFrame(dr)}dr();let sq=1,fo=97;setInterval(()=>{fo=95+Math.random()*30;const b=document.getElementById('bar');if(fo>112){b.textContent=`ENTRAR AGORA - CALL - FORCA ${fo.toFixed(0)}% SEQ ${sq}`;b.style.background='#00ff88';const co=document.getElementById('con'),d=document.createElement('div');d.className='green';d.textContent=`> CALL EUR/JPY ${fo.toFixed(1)}% SEQ ${sq}`;co.prepend(d);sq++;document.getElementById('t').textContent=sq;}else{b.textContent=`ANALISANDO - FORCA ${fo.toFixed(0)}%`;b.style.background='#1a1a1a';b.style.color='#888';}},1200);</script></body></html>
