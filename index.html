<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ATOM BOT v2.1</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial, sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}.topbar{background:#0f0f0f;border-bottom:1px solid #222;height:42px;display:flex;align-items:center;padding:0 8px;gap:6px}.logo{font-weight:900;font-size:11px;line-height:1}.logo small{color:#666;display:block;font-size:8px}.logo b{color:#00ff88}.btn-pause{background:#ff0a0a;color:#fff;border:0;padding:5px 12px;border-radius:3px;font-weight:900;font-size:11px}.timeframes{display:flex;gap:3px}.timeframes button{background:#1c1c1c;border:1px solid #333;color:#777;padding:3px 6px;border-radius:4px;font-size:10px;font-weight:700}.timeframes button.on{background:#fff;color:#000;border-color:#fff}.ativo-tag{margin-left:auto;background:#161616;border:1px solid #2a2a2a;padding:4px 8px;border-radius:4px;font-size:9px;white-space:nowrap}.chart-area{flex:1;background:#070709;position:relative;overflow:hidden;display:flex;flex-direction:column}canvas{flex:1;width:100%}.atom-wrap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:160px;height:160px;pointer-events:none}.core-atom{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:#ffde00;border-radius:50%;box-shadow:0 0 15px #ffde00,0 0 30px #ffde00a0;z-index:3}.orbit{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid}.orbit1{width:70px;height:70px;margin:-35px 0 0 -35px;border-color:rgba(0,255,120,.9);animation:spin1 2s linear infinite}.orbit2{width:110px;height:110px;margin:-55px 0 0 -55px;border-color:rgba(0,220,255,.7);animation:spin2 2.8s linear infinite}.orbit3{width:150px;height:150px;margin:-75px 0 0 -75px;border-color:rgba(255,255,255,.35);animation:spin3 3.5s linear infinite}.dot{position:absolute;width:7px;height:7px;border-radius:50%;left:50%;top:-4px;margin-left:-3.5px;box-shadow:0 0 6px currentColor}.orbit1 .dot{background:#00ff88;color:#00ff88}.orbit2 .dot{background:#00d8ff;color:#00d8ff}.orbit3 .dot{background:#fff;color:#fff}@keyframes spin1{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes spin2{from{transform:rotate(0deg) rotateX(60deg)}to{transform:rotate(360deg) rotateX(60deg)}}@keyframes spin3{from{transform:rotate(0deg) rotateX(-30deg) rotateY(20deg)}to{transform:rotate(360deg) rotateX(-30deg) rotateY(20deg)}}.price-line{position:absolute;left:0;right:0;top:52%;height:1px;background:#ffde00;pointer-events:none}.price-tag{position:absolute;right:0;top:-9px;background:#ffde00;color:#000;font-size:10px;font-weight:900;padding:2px 6px;border-radius:3px}.signal-bar{background:#0a0a0a;border-top:1px solid #222;border-bottom:1px solid #222;padding:10px;text-align:center;font-weight:900;font-size:11px;letter-spacing:.3px}.signal-bar.ok{background:#00c950;color:#000}.signal-bar.wait{background:#111;color:#777}.console{background:#000;height:110px;overflow-y:auto;padding:6px 8px;font-family:monospace;font-size:10px;line-height:1.4;border-top:1px solid #111}.console .g{color:#00ff88}.console .y{color:#ffde00}</style></head><body><div class="topbar"><div class="logo">ATOM<br>BOT<br><small>v2.1</small></div><button class="btn-pause">PAUSE</button><div class="timeframes"><button>5s</button><button>10s</button><button class="on">30s</button><button>M1</button><button>M5</button><button>M15</button></div><div class="ativo-tag">ATIVO:<br>EUR/JPY (OTC)</div></div><div class="chart-area"><canvas id="cv"></canvas><div class="atom-wrap"><div class="orbit orbit1"><div class="dot"></div></div><div class="orbit orbit2"><div class="dot"></div></div><div class="orbit orbit3"><div class="dot"></div></div><div class="core-atom"></div></div><div class="price-line"><div class="price-tag">162.891</div></div></div><div class="signal-bar wait" id="sbar">ANALISANDO - FORCA 97% - AGUARDE...</div><div class="console" id="cons"><div class="g">> ATOM v2.1 BLACK RAIZ ATIVO</div><div>> EUR/JPY (OTC) 30s | SOROS 2x GALE 1</div><div class="y">> Horario Brasilia 04:00-23:30</div></div><script>const c=document.getElementById('cv'),x=c.getContext('2d');function rs(){c.width=c.clientWidth*2;c.height=c.clientHeight*2}rs();addEventListener('resize',rs);let pr=162.891,cds=[];for(let i=0;i<40;i++)cds.push({o:pr+(Math.random()-.5)*.06,c:pr+(Math.random()-.5)*.06});function draw(){let W=c.width,H=c.height;x.clearRect(0,0,W,H);x.fillStyle='#070709';x.fillRect(0,0,W,H);let cw=Math.max(10,W/55);cds.forEach((cd,i)=>{let bx=i*(cw+6)+W*0.05,oy=H*0.65-(cd.o-pr)*1800,cy=H*0.65-(cd.c-pr)*1800,up=cd.c>cd.o;x.strokeStyle=up?'#00ff88':'#ff3b3b';x.fillStyle=up?'#00ff88':'#ff3b3b';x.lineWidth=1;x.beginPath();x.moveTo(bx+cw/2,Math.min(oy,cy)-12);x.lineTo(bx+cw/2,Math.max(oy,cy)+12);x.stroke();x.fillRect(bx,Math.min(oy,cy),cw,Math.max(4,Math.abs(cy-oy)))});pr+=(Math.random()-.5)*.002;cds[cds.length-1].c=pr;if(Math.random()>.88){cds.shift();cds.push({o:pr,c:pr+(Math.random()-.5)*.05})}requestAnimationFrame(draw)}draw();let seq=25,forca=97;const bar=document.getElementById('sbar'),cons=document.getElementById('cons');setInterval(()=>{forca=80+Math.random()*30;if(forca>102){bar.className='signal-bar ok';bar.textContent=`ENTRAR AGORA - CALL - FORCA ${forca.toFixed(1)}% - SEQ ${seq}`;let d=document.createElement('div');d.className='g';d.textContent=`> CALL EUR/JPY ${forca.toFixed(1)}% SEQ ${seq} ${new Date().toLocaleTimeString()}`;cons.prepend(d);seq++;}else{bar.className='signal-bar wait';bar.textContent=`ANALISANDO - FORCA ${forca.toFixed(0)}% - AGUARDE...`;}},1300);</script></body></html>
