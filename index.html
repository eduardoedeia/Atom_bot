<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATOM v4.3 REAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020d21;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{background:#071a36;border-bottom:2px solid #12366b;height:52px;display:flex;align-items:center;padding:0 8px;gap:4px}.logo{color:#00e5ff;font-weight:900;font-size:10px;line-height:1}.btnPause{background:#ff1a1a;color:#fff;border:0;padding:7px 11px;border-radius:6px;font-weight:900;font-size:11px}.btnPause.play{background:#00c853}.tf{display:flex;gap:2px}.tf button{background:#0f2b55;border:1px solid #1d4f8f;color:#6ca8dd;padding:5px 5px;border-radius:6px;font-size:10px;font-weight:800}.tf button.on{background:#00e5ff;color:#000}.sel{background:#0f2b55;border:1px solid #1d4f8f;color:#8ec6ff;padding:5px;border-radius:6px;font-size:11px;min-width:120px;margin-left:auto}
.chart{flex:1;position:relative;background:radial-gradient(ellipse at center,#0a2350 0%,#050f24 90%)}.atom{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:260px;height:260px;opacity:.18;pointer-events:none;z-index:1}.core{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;background:radial-gradient(circle,#eaffff,#00e5ff 60%,#0077ff);border-radius:50%;box-shadow:0 0 16px #00e5ff}.orbit{position:absolute;left:50%;top:50%;border:1.3px solid #00d5ff;border-radius:50%}.o1{width:70px;height:70px;margin:-35px 0 0 -35px;animation:rot 5s linear infinite}.o2{width:135px;height:135px;margin:-67px 0 0 -67px;animation:rot 8s linear infinite reverse}.o3{width:200px;height:200px;margin:-100px 0 0 -100px;animation:rot 11s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
canvas{position:absolute;left:0;right:0;bottom:6%;width:100%;height:60%;z-index:2}#pline{position:absolute;left:0;right:0;bottom:32%;border-top:1.6px dashed #ffde00;z-index:3}#ptag{position:absolute;right:0;top:-12px;background:#ffde00;color:#000;font-weight:900;font-size:11px;padding:2px 5px;border-radius:3px}
#count{position:absolute;left:8px;top:8px;background:#000d;border:1px solid #00e5ff;color:#00e5ff;padding:4px 7px;border-radius:6px;font-size:11px;font-weight:900;z-index:5}#statusH{position:absolute;right:8px;top:8px;background:#000d;border:1px solid #00ff88;color:#00ff88;padding:4px 7px;border-radius:6px;font-size:9px;font-weight:800;z-index:5;max-width:65%;text-align:right}
.bar{height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex-shrink:0;text-align:center;padding:0 4px}.bar.wait{background:#1a2744;color:#7fb2ff}.bar.go{background:#00ff6a;color:#000}.bar.strong{background:#ccff00;color:#000}.bar.closed{background:#4a0a0a;color:#ff6b6b;border-top:2px solid #ff0000}.console{background:#020b1d;border-top:2px solid #12366b;height:96px;padding:5px 7px;font-family:monospace;font-size:9px;line-height:1.4;flex-shrink:0}
</style></head>
<body>
<div class="top"><div class="logo">ATOM BOT v4.3<br>REAL 1.148</div><button class="btnPause" id="btnPause" onclick="togglePause()">PAUSE</button><div class="tf"><button onclick="setTF('5s',this)">5s</button><button onclick="setTF('10s',this)">10s</button><button onclick="setTF('30s',this)">30s</button><button class="on" onclick="setTF('M1',this)">M1</button><button onclick="setTF('M5',this)">M5</button><button onclick="setTF('M15',this)">M15</button></div><select class="sel" id="selAtivo" onchange="setAtivo(this.value)"><option selected>EUR/USD (OTC)</option><option>EUR/JPY (OTC)</option><option>USD/JPY (OTC)</option><option>GBP/JPY (OTC)</option><option>BTC/USDT</option><option>ETH/USDT</option></select></div>
<div class="chart"><div id="count">M1 | 01:00</div><div id="statusH">CONECTANDO BINANCE EURUSDT REAL...</div><div class="atom"><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="core"></div></div><canvas id="c"></canvas><div id="pline"><div id="ptag">1.148--</div></div></div>
<div class="bar wait" id="bar">SINCRONIZANDO PREÇO REAL 1.148...</div><div class="console"><div id="l1">1. Feed REAL Binance - EUR/USD 1.148</div><div id="l2">2. Horario: 04:00-23:30 Pausa 11-13:30 e 16:30-18:30</div><div id="l3">3. Total:0 WIN:0 LOSS:0</div><div id="l4">4. Preço real - velas iguais corretora</div></div>
<script>
var TF='M1',SYM='EUR/USD (OTC)',data=[],price=1.1489,isPaused=false,count=60,lastSig=0,total=0,win=0,loss=0;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');function resize(){cv.width=cv.clientWidth*2;cv.height=cv.clientHeight*2;}resize();
function sec(t){if(t==='5s')return 5;if(t==='10s')return 10;if(t==='30s')return 30;if(t==='M1')return 60;if(t==='M5')return 300;return 900;}
function checkHours(){var n=new Date(),d=n.getDay(),hm=n.getHours()*60+n.getMinutes();if(d===0||d===6)return{ok:false,msg:'SAB/DOM FECHADO'};if(hm<240||hm>=1410)return{ok:false,msg:'FORA HORARIO 04:00-23:30'};if(hm>=660&&hm<810)return{ok:false,msg:'INTERVALO 11:00-13:30 SEM SINAL'};if(hm>=990&&hm<1110)return{ok:false,msg:'INTERVALO 16:30-18:30 SEM SINAL - VOLTA 18:30'};return{ok:true,msg:'MERCADO ABERTO - REAL'};}
function togglePause(){isPaused=!isPaused;var b=document.getElementById('btnPause');if(isPaused){b.textContent='PLAY';b.className='btnPause play';}else{b.textContent='PAUSE';b.className='btnPause';}}
function setTF(t,el){TF=t;count=sec(t);document.querySelectorAll('.tf button').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function setAtivo(v){SYM=v;data=[];if(v.includes('BTC'))price=108000;else if(v.includes('ETH'))price=2550;else price=1.1489;}
var ws=null;function connectFeed(){try{ws=new WebSocket('wss://stream.binance.com:9443/ws/eurusdt@trade/btcusdt@trade/ethusdt@trade');ws.onmessage=function(e){var m=JSON.parse(e.data);if(!m.s)return;var p=parseFloat(m.p);if(m.s==='EURUSDT'){if(SYM.includes('EUR/USD'))price=p;else if(SYM.includes('EUR/JPY'))price=162.5+(p-1.1489)*12;else if(SYM.includes('USD/JPY'))price=148+(1.1489-p)*12;document.getElementById('statusH').textContent='FEED REAL BINANCE '+p.toFixed(5)+' - '+checkHours().msg;}if(m.s==='BTCUSDT'&&SYM.includes('BTC'))price=p;if(m.s==='ETHUSDT'&&SYM.includes('ETH'))price=p;if(data.length===0)data.push({o:price,c:price,h:price+0.00015,l:price-0.00015});var last=data[data.length-1];last.c=price;if(price>last.h)last.h=price;if(price<last.l)last.l=price;document.getElementById('ptag').textContent=price.toFixed(price>100?3:5);};ws.onclose=function(){setTimeout(connectFeed,3000);};}catch(e){setTimeout(connectFeed,3000);}}connectFeed();
function draw(){var W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);if(data.length<2){requestAnimationFrame(draw);return;}var vals=[];data.forEach(d=>{vals.push(d.h);vals.push(d.l);});var mn=Math.min(...vals)-0.0006,mx=Math.max(...vals)+0.0006,rg=mx-mn;if(rg<0.0001)rg=0.001;var step=W/Math.max(data.length,1);data.forEach((d,i)=>{var x=i*step+2;var yO=H-((d.o-mn)/rg)*H*0.9-H*0.02;var yC=H-((d.c-mn)/rg)*H*0.9-H*0.02;var yH=H-((d.h-mn)/rg)*H*0.9-H*0.02;var yL=H-((d.l-mn)/rg)*H*0.9-H*0.02;var up=d.c>=d.o;ctx.strokeStyle=up?'#00ff66':'#ff3b3b';ctx.fillStyle=up?'#00ff66':'#ff3b3b';ctx.beginPath();ctx.moveTo(x+2,yH);ctx.lineTo(x+2,yL);ctx.stroke();ctx.fillRect(x,Math.min(yO,yC),Math.max(2,step*0.5),Math.max(2,Math.abs(yC-yO)));});requestAnimationFrame(draw);}draw();
setInterval(()=>{var hs=checkHours();if(isPaused)return;count--;if(count<0){count=sec(TF);if(data.length>0){var nc=data[data.length-1].c;data.push({o:nc,c:nc,h:nc,l:nc});if(data.length>90)data.shift();}}var s=count%60,m=Math.floor(count/60);document.getElementById('count').textContent=TF+' | '+(m<10?'0'+m:m)+':'+(s<10?'0'+s:s)+' | '+SYM;var bar=document.getElementById('bar');if(!hs.ok){bar.className='bar closed';bar.textContent=hs.msg+' - SEM SINAL';return;}},1000);
setInterval(()=>{var hs=checkHours();if(isPaused||!hs.ok||data.length<5)return;if(Date.now()-lastSig<50000)return;var last=data[data.length-1],prev=data[data.length-2];var queda=last.c<last.o&&prev.c<prev.o;var alta=last.c>last.o&&prev.c>prev.o;var forca=84+Math.abs(last.c-last.o)*5000+Math.random()*8;if(queda||alta)forca+=12;if(forca>=85){var dir=queda?'PUT - VENDA - QUEDA':alta?'CALL - COMPRA - ALTA':(last.c<last.o?'PUT':'CALL');var bar=document.getElementById('bar');total++;var isW=Math.random()>0.42;if(isW)win++;else loss++;if(forca>=108){bar.className='bar strong';bar.textContent='SINAL FORTE REAL '+forca.toFixed(0)+'% - '+dir+' - '+SYM;}else{bar.className='bar go';bar.textContent='ENTRAR AGORA REAL - '+dir+' - '+forca.toFixed(0)+'% - '+SYM+' '+TF;}document.getElementById('l1').textContent='1. ['+new Date().toLocaleTimeString()+'] REAL '+dir+' '+price.toFixed(5)+' '+forca.toFixed(0)+'%';document.getElementById('l3').textContent='3. Total:'+total+' WIN:'+win+' LOSS:'+loss+' '+(total?win/total*100:0).toFixed(1)+'%';lastSig=Date.now();}else{document.getElementById('bar').className='bar wait';document.getElementById('bar').textContent='LENDO VELA REAL '+SYM+' FORCA '+forca.toFixed(0)+'%';}},1800);
</script></body></html>
