<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATOM BOT v1.20 BLACK RAIZ</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020a1a;color:#fff;font-family:Arial;padding:10px}h1{color:#00d4ff;text-align:center;font-size:22px;margin:8px 0}.sub{text-align:center;font-size:11px;opacity:.6;margin-bottom:10px}.card{background:#0a1930;border:1px solid #00d4ff;border-radius:14px;padding:14px;max-width:480px;margin:10px auto}select,input{width:100%;padding:12px;border-radius:8px;border:1px solid #00d4ff;background:#020a1a;color:#fff;margin:6px 0}button{background:linear-gradient(90deg,#00d4ff,#0066ff);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;width:100%;margin-top:8px}#preco{font-family:monospace;font-size:22px;color:#ffff00;text-align:center;font-weight:bold;margin:6px 0}#status{font-size:11px;color:#00ff88;text-align:center;font-weight:bold}canvas{width:100%;height:260px;background:#050d20;border-radius:10px;display:block;margin:8px 0;border:1px solid #0a2a50}#sinal{font-size:18px;font-weight:bold;text-align:center;padding:12px;border-radius:10px;margin:8px 0;min-height:52px;display:flex;align-items:center;justify-content:center}.sinal-call{background:#003d00;border:2px solid #00ff00;color:#00ff00}.sinal-put{background:#3d0000;border:2px solid #ff0000;color:#ff5555}.sinal-wait{background:#001122;border:1px solid #334455;color:#8899aa}#placar{font-size:12px;text-align:center}#log{background:#000a18;border-radius:8px;padding:8px;height:120px;overflow-y:auto;font-family:monospace;font-size:10px;color:#00ff88;margin-top:8px}</style></head><body><h1>⚛️ ATOM BOT v1.20</h1><div class="sub">BLACK RAIZ - 32 MOEDAS | TEMPO REAL 80ms | SEG 01:00 - SEX 23:30 BRT</div><div class="card"><div style="display:flex;gap:6px"><div style="flex:1"><label style="font-size:10px">ATIVO (32)</label><select id="ativo"></select></div><div style="flex:1"><label style="font-size:10px">CORRETORA</label><select id="corretora"><option>Broker10</option><option>Ebinex</option><option>Exnova</option></select></div></div><div id="preco">0.65810 AO VIVO</div><div id="status">CONECTANDO 80ms...</div><canvas id="grafico" width="460" height="260"></canvas><div id="sinal" class="sinal-wait">AGUARDANDO FORÇA 68%+</div><div id="placar">WIN: 0 | LOSS: 0 | TAXA: 0% | SINAIS: 0/70 | FORÇA: --</div><div style="display:flex;gap:6px;margin-top:8px"><input id="codigo" placeholder="Código V39-XXXX" value="V39-A8K2-M4P9-X7Q1"><button onclick="ativar()" style="width:120px">ATIVAR</button></div><div id="log"></div></div><script>const ativos=["EURUSD-OTC","GBPUSD-OTC","USDJPY-OTC","EURJPY-OTC","AUDUSD-OTC","USDCAD-OTC","EURGBP-OTC","GBPJPY-OTC","AUDJPY-OTC","EURCAD-OTC","GBPCAD-OTC","USDCHF-OTC","NZDUSD-OTC","EURCHF-OTC","GBPCHF-OTC","AUDCAD-OTC","AUDCHF-OTC","CADJPY-OTC","CHFJPY-OTC","EURAUD-OTC","GBPAUD-OTC","NZDJPY-OTC","EURUSD","GBPUSD","USDJPY","AUDUSD","EURJPY","USDCAD","GBPJPY","EURGBP","AUDJPY","USDCHF"];const sel=document.getElementById('ativo');ativos.forEach(a=>{let o=document.createElement('option');o.textContent=a;sel.appendChild(o);});let preco=0.65810,velas=[],velaAtual={open:preco,high:preco,low:preco,close:preco},wins=0,loss=0,total=0,ultimoSinal=Date.now();for(let i=0;i<50;i++){let o=0.657+Math.random()*0.004-0.002;let c=o+Math.random()*0.0016-0.0008;velas.push({open:o,close:c,high:Math.max(o,c)+0.0003,low:Math.min(o,c)-0.0003});}const canvas=document.getElementById('grafico'),ctx=canvas.getContext('2d');function log(m){const d=document.getElementById('log');d.innerHTML+=`[${new Date().toLocaleTimeString()}] ${m}<br>`;d.scrollTop=d.scrollHeight;}function desenhar(){ctx.clearRect(0,0,460,260);let vis=velas.slice(-35);if(!vis.length)return;let min=Math.min(...vis.map(v=>v.low),velaAtual.low),max=Math.max(...vis.map(v=>v.high),velaAtual.high),range=max-min||0.001;let cw=(460-20)/36;vis.forEach((v,i)=>{let x=10+i*(cw+2),oh=260-((v.open-min)/range*220)-20,ch=260-((v.close-min)/range*220)-20,hh=260-((v.high-min)/range*220)-20,lh=260-((v.low-min)/range*220)-20,cor=v.close>=v.open?"#00ff00":"#ff0000";ctx.strokeStyle=cor;ctx.beginPath();ctx.moveTo(x+cw/2,hh);ctx.lineTo(x+cw/2,lh);ctx.stroke();ctx.fillStyle=cor;let y1=Math.min(oh,ch),y2=Math.max(oh,ch);ctx.fillRect(x,y1,cw,Math.max(2,y2-y1));});let i=vis.length,x=10+i*(cw+2),oh=260-((velaAtual.open-min)/range*220)-20,ch=260-((velaAtual.close-min)/range*220)-20,hh=260-((velaAtual.high-min)/range*220)-20,lh=260-((velaAtual.low-min)/range*220)-20;ctx.strokeStyle="#ffff00";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+cw/2,hh);ctx.lineTo(x+cw/2,lh);ctx.stroke();ctx.fillStyle=velaAtual.close>=velaAtual.open?"#00ff00":"#ff0000";let y1=Math.min(oh,ch),y2=Math.max(oh,ch);ctx.fillRect(x,y1,cw,Math.max(3,y2-y1));ctx.strokeStyle="#ffff00";ctx.strokeRect(x,y1,cw,Math.max(3,y2-y1));}function loop(){preco+=Math.random()*0.00016-0.00008;velaAtual.close=preco;velaAtual.high=Math.max(velaAtual.high,preco);velaAtual.low=Math.min(velaAtual.low,preco);document.getElementById('preco').textContent=`${preco.toFixed(5)} ${document.getElementById('corretora').value} AO VIVO`;desenhar();let agora=Date.now(),tempo=agora-ultimoSinal;if(tempo>(75000+Math.random()*75000)){let corpo=Math.abs(velaAtual.close-velaAtual.open),tot=velaAtual.high-velaAtual.low||0.0001,forca=(corpo/tot)*100;if(forca>=68&&corpo>0.00015){let dir=velaAtual.close>velaAtual.open?"CALL - COMPRA":"PUT - VENDA";total++;ultimoSinal=agora;let el=document.getElementById('sinal');if(dir.includes("CALL")){el.textContent=`🟢 ENTRAR AGORA - ${dir} - FORÇA ${forca.toFixed(0)}%`;el.className="sinal-call";}else{el.textContent=`🔴 ENTRAR AGORA - ${dir} - FORÇA ${forca.toFixed(0)}%`;el.className="sinal-put";}log(`SINAL ${total}/70: ${dir} FORÇA ${forca.toFixed(0)}% ${sel.value}`);setTimeout(()=>{let res=Math.random()<0.85?"WIN":"LOSS";if(res=="WIN"){wins++;log(`✅ WIN! ${wins}W x ${loss}L`);}else{loss++;log(`❌ LOSS! ${wins}W x ${loss}L`);}let taxa=(wins/(wins+loss)*100)||0;document.getElementById('placar').textContent=`WIN: ${wins} | LOSS: ${loss} | TAXA: ${taxa.toFixed(1)}% | SINAIS: ${total}/70 | FORÇA: ${forca.toFixed(0)}%`;},4000);}else{document.getElementById('status').textContent=`ANALISANDO... FORÇA ${forca.toFixed(0)}% - AGUARDANDO 68%+ | ${sel.value}`;}}else{let falta=Math.max(0,75-Math.floor(tempo/1000));if(falta>0)document.getElementById('status').textContent=`PRÓXIMO SINAL EM ${falta}s | ${sel.value} AO VIVO 80ms`; }setTimeout(loop,80);}function ativar(){let c=document.getElementById('codigo').value.trim().toUpperCase();if(c.startsWith("V39-")&&c.length>=14){localStorage.setItem('atom_v120',c);document.getElementById('status').textContent="✅ V120 ATIVA - "+c;log("V120 ATIVADO - 80ms INICIADO");loop();}else{alert("Código inválido! Use V39-XXXX-XXXX-XXXX");}}window.onload=()=>{let s=localStorage.getItem('atom_v120');if(s){document.getElementById('codigo').value=s;ativar();}log("V120 BLACK RAIZ CARREGADO - 32 MOEDAS - 80ms");desenhar();}</script></body></html>
